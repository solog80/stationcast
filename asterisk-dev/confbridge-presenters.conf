; Presenter conference profiles (development)
; ConfBridge(presenters,presenters_bridge,presenters_user)
;
; ConfBridge provides mix-minus: every participant hears the mix of the other
; participants (and the Comrex return), never their own audio.

[presenters_bridge]
type=bridge
max_members=20
mixing_interval=20
internal_sample_rate=48000
record_conference=no
video_mode=none
language=en

; Presenters join muted so a new phone cannot disrupt anyone already on air.
[presenters_user]
type=user
quiet=yes
announce_join_leave=no
announce_user_count=no
music_on_hold_when_empty=no
talk_detection_events=yes
jitterbuffer=yes
dtmf_passthrough=no
startmuted=yes

; The Comrex leg is controlled by the producer, so it must never be muted.
[comrex_user]
type=user
quiet=yes
announce_join_leave=no
announce_user_count=no
music_on_hold_when_empty=no
talk_detection_events=yes
jitterbuffer=yes
dtmf_passthrough=no
startmuted=no
