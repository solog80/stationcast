; Presenter dialplan (development)
; Included at the end of extensions.conf. Endpoints use context=presenters.

[presenters]

; Legacy app dial target: the app currently dials 100 (studio/Comrex).
; In dev, 100 joins the presenter conference so existing builds can test.
exten => 100,1,NoOp(Join presenter conference via legacy 100)
 same => n,ConfBridge(presenters,presenters_bridge,presenters_user)
 same => n,Hangup()

; All presenters join the same conference. ConfBridge mixes them and excludes
; each participant's own audio (mix-minus).
exten => 7000,1,NoOp(Join presenter conference)
 same => n,ConfBridge(presenters,presenters_bridge,presenters_user)
 same => n,Hangup()

; Test path: dial the Comrex/studio endpoint from a registered presenter.
exten => 7100,1,NoOp(Call Comrex studio)
 same => n,Dial(PJSIP/station,45)
 same => n,Hangup()
